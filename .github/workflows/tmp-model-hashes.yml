# TEMPORARY (issue #4): print pinned revision + SHA-256 of whisper.cpp ggml files. Removed before PR.
name: tmp-model-hashes
on:
  push:
    branches: [issue-4-transcription]
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSf "https://huggingface.co/api/models/ggerganov/whisper.cpp/revision/main?blobs=true" -o info.json
          python3 - <<'PY'
          import json
          d = json.load(open("info.json"))
          print("REVISION", d["sha"])
          want = {"ggml-tiny.bin", "ggml-small-q5_1.bin", "ggml-medium-q5_0.bin", "ggml-large-v3-turbo-q5_0.bin"}
          for s in d["siblings"]:
              if s["rfilename"] in want:
                  print("FILE", s["rfilename"], s["lfs"]["sha256"], s["lfs"]["size"])
          PY
