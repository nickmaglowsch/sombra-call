name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Description references an issue and keeps the template
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "::error::PR description must reference its issue, e.g. 'Closes #12'."
            fail=1
          fi
          if ! printf '%s' "$BODY" | grep -q '## Quality gates'; then
            echo "::error::PR description must keep the '## Quality gates' checklist from the template."
            fail=1
          fi
          exit $fail
