# Tag-driven releases (issue #44, ADR 0044; Sombra.app: issue #50, ADR 0050). See docs/release.md.
#
# - push of a tag vX.Y.Z[-rcN|-betaN|-alphaN]: build → smoke install → publish a GitHub Release.
#   Sombra.app is built and signed with the project's self-signed certificate (app), then
#   installed and verified on a clean Mac (app-smoke). publish runs the macOS release gate:
#   a final tag is refused unless the app is signed by the pinned certificate.
# - pull_request touching the release files: the same jobs, no publish, so the PR proves the
#   pipeline. Without the signing secrets (always on PRs) the app is ad-hoc signed; a twin
#   signed with a throwaway certificate made in the job proves the self-signed path.
# - workflow_dispatch: the same as a PR, but signs with the project's certificate when the
#   secrets exist, to test the setup without pushing a tag.
#
# Not a required check: the ruleset only requires the jobs in ci.yml.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - scripts/install.sh
      - tests/release/**
      - pyproject.toml
      - uv.lock
      - src/sombra/__init__.py
      - src/sombra/cli.py
      - src/sombra/config/doctor.py
      - packaging/macos/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tags
      - name: Restore the annotated tag
        # actions/checkout re-fetches the pushed tag as a lightweight tag on the commit.
        # git describe (hatch-vcs) prefers annotated tags, so an rc tag on the same commit
        # (v0.1.0-rc3 and v0.1.0) would win and build the rc version.
        if: github.ref_type == 'tag'
        run: git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@v6
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main; tag a merged commit."
            exit 1
          fi
      - name: Build sdist + wheel
        run: uv build --out-dir dist
      - name: Add install.sh (when it exists)
        run: |
          if [ -f scripts/install.sh ]; then cp scripts/install.sh dist/install.sh; fi
      - name: Version matches the tag
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # shellcheck disable=SC2046 # one word per tag name
            uv run --no-project --python 3.12 scripts/release/tags.py check "$GITHUB_REF_NAME" \
              --dist dist --github-output "$GITHUB_OUTPUT" --tags $(git tag --list 'v*')
          else
            wheel=$(basename dist/sombra-*.whl)
            echo "version=$(echo "$wheel" | cut -d- -f2)" | tee -a "$GITHUB_OUTPUT"
            echo "prerelease=true" | tee -a "$GITHUB_OUTPUT"
            echo "latest=false" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Write and verify SHA256SUMS
        run: |
          uv run --no-project --python 3.12 scripts/release/checksums.py write dist
          uv run --no-project --python 3.12 scripts/release/checksums.py verify dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ADR 0044: macOS 14+ on Apple Silicon; Ubuntu 22.04/24.04 on x86_64 and aarch64.
        os: [macos-14, ubuntu-latest, ubuntu-22.04, ubuntu-24.04-arm]
    env:
      # Install with a uv-managed CPython, as end users do, never the runner's Python.
      UV_PYTHON_PREFERENCE: only-managed
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      # No checkout: install only the built artifacts, the way end users get them.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify SHA256SUMS with the stock tool (the command docs/release.md gives users)
        working-directory: dist
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 -c --ignore-missing SHA256SUMS
          else
            sha256sum -c --ignore-missing SHA256SUMS
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false # a clean runner, as a first-time user has
      - name: Install
        run: |
          wheel=$(ls dist/sombra-*.whl)
          if [ -f dist/install.sh ]; then
            sh dist/install.sh --from-wheel "$wheel" --yes --no-models
          else
            uv tool install --python 3.12 "$wheel"
          fi
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: sombra --version
        run: |
          got=$(sombra --version)
          echo "$got"
          test "$got" = "sombra $EXPECTED_VERSION"
      - name: sombra --help
        run: sombra --help
      - name: sombra new
        run: |
          dir=$(sombra new "Release smoke")
          echo "$dir"
          test -d "$dir"
      # `sombra replay` runs the whole pipeline (VAD, whisper, dedupe, trigger, store) on the
      # synthetic PT-BR e2e fixture, with the fake brain: no API key, no permissions.
      # Only the fixture files are checked out, never the source.
      - uses: actions/checkout@v4
        with:
          path: fixture-src
          sparse-checkout: tests/fixtures/e2e
          sparse-checkout-cone-mode: false
      - name: Cache models (whisper tiny + Silero VAD)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sombra/models
          key: release-smoke-models-${{ runner.os }}-${{ runner.arch }}-tiny-vad
      - name: sombra models download tiny
        run: sombra models download tiny
      - name: sombra replay (fake brain)
        run: |
          fx=fixture-src/tests/fixtures/e2e
          out=$(sombra replay "$fx/me.wav" "$fx/others.wav" --frames "$fx/frames" \
            --user Maria --fake-brain --auto-approve --stt-model tiny \
            --name release-smoke --root "$RUNNER_TEMP/meetings")
          echo "$out"
          dir=$(echo "$out" | head -n 1)
          test -s "$dir/transcript.md"
          # The fixture calls Maria once: expect exactly trigger -> suggestion -> action.
          "$(uv tool dir)/sombra/bin/python" -c "
          import json, pathlib, sys
          log = pathlib.Path(sys.argv[1], 'log.jsonl').read_text().splitlines()
          types = [json.loads(line)['type'] for line in log]
          print(types)
          assert types == ['trigger', 'suggestion', 'action'], types" "$dir"

  app:
    name: app (macos-14)
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # The project's self-signed certificate signs tags and manual runs when the secrets
      # exist; PRs and forks never get them and sign ad-hoc (ADR 0050).
      SIGN: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && secrets.MACOS_SELFSIGN_P12_BASE64 != '' }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      # packaging/macos and uv.lock (the pinned dependencies); the app is built from the wheel.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build Sombra.app (PyInstaller, locked dependencies)
        id: build
        run: |
          wheel=$(ls dist/sombra-*.whl)
          uv run --no-project --python 3.12 packaging/macos/build.py --wheel "$wheel" \
            --out "$RUNNER_TEMP/app" --github-output "$GITHUB_OUTPUT"
          # An unsigned twin for the throwaway-certificate test below.
          mkdir -p "$RUNNER_TEMP/test"
          ditto "$RUNNER_TEMP/app/dist/Sombra.app" "$RUNNER_TEMP/test/Sombra.app"
      - name: Info.plist carries the release version and both localisations
        env:
          APP: ${{ steps.build.outputs.app }}
        run: |
          got=$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")
          echo "CFBundleShortVersionString=$got"
          test "$got" = "$EXPECTED_VERSION"
          plutil -lint "$APP/Contents/Info.plist" "$APP"/Contents/Resources/*.lproj/InfoPlist.strings

      # --- the release app: the project's certificate, or ad-hoc ------------------------
      - name: Import the project's signing identity
        id: identity
        if: env.SIGN == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/identity.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          sh scripts/release/import-signing-identity.sh "$p12" "$P12_PASSWORD" \
            "$RUNNER_TEMP/release.keychain-db" --github-output "$GITHUB_OUTPUT"
          rm -f "$p12"
      - name: The identity is the pinned certificate
        if: env.SIGN == 'true'
        env:
          SHA256: ${{ steps.identity.outputs.sha256 }}
        run: |
          pinned=$(uv run --no-project --python 3.12 python -c \
            'import sys; sys.path.insert(0, "scripts/release"); import app_gate; print(app_gate.read_pinned())')
          if [ -z "$pinned" ]; then
            echo "::warning::packaging/macos/signing-cert.sha256 pins no certificate yet: the release gate will refuse final tags."
          elif [ "$pinned" != "$SHA256" ]; then
            echo "::error::MACOS_SELFSIGN_P12_BASE64 holds certificate $SHA256, but $pinned is pinned."
            exit 1
          fi
      - name: Sign every Mach-O inside-out (hardened runtime)
        env:
          APP: ${{ steps.build.outputs.app }}
          IDENTITY: ${{ steps.identity.outputs.sha1 }}
        run: |
          if [ "$SIGN" = true ]; then
            uv run --no-project --python 3.12 packaging/macos/sign.py "$APP" --identity "$IDENTITY"
          else
            echo "::notice::No signing secrets on this run: Sombra.app is ad-hoc signed, so its TCC grants would reset on every upgrade (ADR 0050)."
            uv run --no-project --python 3.12 packaging/macos/sign.py "$APP" --identity -
          fi
          codesign -d -r- "$APP"
      - name: Zip with ditto and report the size
        env:
          APP: ${{ steps.build.outputs.app }}
        run: |
          mkdir -p app-dist
          zip="app-dist/Sombra-$EXPECTED_VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$zip"
          app_mb=$(du -sm "$APP" | cut -f 1)
          zip_mb=$(( $(stat -f %z "$zip") / 1048576 ))
          files=$(find "$APP" -type f | wc -l | tr -d ' ')
          signature=$([ "$SIGN" = true ] && echo "the project's self-signed certificate" || echo "ad-hoc (no signing secrets)")
          {
            echo "### Sombra.app $EXPECTED_VERSION"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| signature | $signature |"
            echo "| app on disk | ${app_mb} MB, ${files} files |"
            echo "| $(basename "$zip") | ${zip_mb} MB |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: app-dist/
          if-no-files-found: error
          retention-days: 14

      # --- self-signing, proven with a throwaway certificate made in this job -----------
      - name: Make and import a throwaway self-signed identity
        id: throwaway
        run: |
          sh scripts/release/make-signing-identity.sh --out "$RUNNER_TEMP/throwaway" \
            --name "Sombra CI Throwaway" --days 2 --github-output "$RUNNER_TEMP/made.txt"
          p12=$(sed -n 's/^p12=//p' "$RUNNER_TEMP/made.txt")
          password=$(sed -n 's/^password=//p' "$RUNNER_TEMP/made.txt")
          echo "::add-mask::$password"
          sh scripts/release/import-signing-identity.sh "$p12" "$password" \
            "$RUNNER_TEMP/throwaway.keychain-db" --github-output "$GITHUB_OUTPUT"
      - name: Sign the twin with it; the designated requirement pins the certificate
        env:
          APP: ${{ runner.temp }}/test/Sombra.app
          SHA1: ${{ steps.throwaway.outputs.sha1 }}
        run: |
          uv run --no-project --python 3.12 packaging/macos/sign.py "$APP" --identity "$SHA1"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|CodeDirectory)'
          dr=$(codesign -d -r- "$APP" 2>/dev/null | sed -n 's/^#* *designated => //p')
          echo "designated => $dr"
          if [ -z "$dr" ]; then echo "::error::could not read the designated requirement"; exit 1; fi
          echo "$dr" | grep -q 'identifier "io.github.nickmaglowsch.Sombra"'
          echo "$dr" | grep -qiE "certificate (leaf|root) = H\"$SHA1\""
          if echo "$dr" | grep -q cdhash; then echo "::error::the requirement pins the cdhash"; exit 1; fi
          echo "DR_SELF=$dr" >> "$GITHUB_ENV"
      - name: A rebuilt app still satisfies the old requirement; an ad-hoc one does not
        env:
          SIGNED: ${{ runner.temp }}/test/Sombra.app
          ADHOC: ${{ steps.build.outputs.app }}
          SHA1: ${{ steps.throwaway.outputs.sha1 }}
        run: |
          # "Upgrade": change the app (a new build number), re-sign with the same identity.
          # TCC re-checks the requirement it stored at grant time against the new app.
          next="$RUNNER_TEMP/next"
          mkdir -p "$next/self" "$next/adhoc"
          ditto "$SIGNED" "$next/self/Sombra.app"
          plutil -replace CFBundleVersion -string "next" "$next/self/Sombra.app/Contents/Info.plist"
          uv run --no-project --python 3.12 packaging/macos/sign.py "$next/self/Sombra.app" --identity "$SHA1"
          codesign --verify -R="$DR_SELF" "$next/self/Sombra.app"
          echo "self-signed: the next build satisfies the stored requirement -> grants persist"
          if [ "$SIGN" != true ]; then
            dr_adhoc=$(codesign -d -r- "$ADHOC" 2>/dev/null | sed -n 's/^#* *designated => //p')
            echo "ad-hoc requirement: $dr_adhoc"
            if [ -z "$dr_adhoc" ]; then echo "::error::could not read the ad-hoc requirement"; exit 1; fi
            ditto "$ADHOC" "$next/adhoc/Sombra.app"
            plutil -replace CFBundleVersion -string "next" "$next/adhoc/Sombra.app/Contents/Info.plist"
            uv run --no-project --python 3.12 packaging/macos/sign.py "$next/adhoc/Sombra.app" --identity -
            out=$(codesign --verify -R="$dr_adhoc" "$next/adhoc/Sombra.app" 2>&1) && rc=0 || rc=$?
            echo "$out"
            if [ "$rc" -eq 0 ] || ! echo "$out" | grep -q "failed to satisfy"; then
              echo "::error::expected the ad-hoc rebuild to fail the old cdhash requirement"; exit 1
            fi
            echo "ad-hoc: the next build fails the stored requirement -> grants reset"
          fi
      - name: Zip the throwaway-signed app for app-smoke
        env:
          APP: ${{ runner.temp }}/test/Sombra.app
          SHA256: ${{ steps.throwaway.outputs.sha256 }}
        run: |
          mkdir -p app-test
          ditto -c -k --sequesterRsrc --keepParent "$APP" "app-test/Sombra-$EXPECTED_VERSION-macos-arm64.zip"
          echo "$SHA256" > app-test/pinned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-selfsigned-test
          path: app-test/
          if-no-files-found: error
          retention-days: 7
      - name: Remove the keychains
        if: always()
        run: |
          for kc in "$RUNNER_TEMP/release.keychain-db" "$RUNNER_TEMP/throwaway.keychain-db"; do
            if [ -f "$kc" ]; then security delete-keychain "$kc" || true; fi
          done
          rm -rf "$RUNNER_TEMP/throwaway"

  app-smoke:
    name: app-smoke (${{ matrix.variant }})
    needs: [build, app]
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # release: the app a tag would publish (ad-hoc on PRs).
        # selfsigned-test: the same build signed with the job's throwaway certificate.
        variant: [release, selfsigned-test]
    env:
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      ARTIFACT: ${{ matrix.variant == 'release' && 'macos-app' || 'macos-app-selfsigned-test' }}
    steps:
      # A clean Mac: install the zip the way users get it (install.sh), then check it.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: macos-app
      # The gate script, the bundle definition and the e2e fixture only; never the source.
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            scripts/release
            packaging/macos
            tests/fixtures/e2e
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install with install.sh (Sombra.app + CLI shim, quarantine removed)
        run: |
          zip=$(ls macos-app/Sombra-*-macos-arm64.zip)
          # Simulate a browser download: install.sh must strip the quarantine it inherits.
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$zip"
          sh dist/install.sh --from-app-zip "$zip" --yes --no-models
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          app=/Applications/Sombra.app
          test -d "$app" || app="$HOME/Applications/Sombra.app"
          if xattr -r -p com.apple.quarantine "$app" 2>/dev/null | grep -q .; then
            echo "::error::$app still carries com.apple.quarantine"; exit 1
          fi
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: codesign --verify --deep --strict
        run: |
          ls -l "$HOME/.local/bin/sombra"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP"
          codesign -d -r- "$APP"
          codesign -dv --verbose=4 "$APP/Contents/Helpers/sombra"
          codesign -d --entitlements - "$APP"
      - name: Record the release-gate evidence
        run: |
          uv run --no-project --python 3.12 repo/scripts/release/app_gate.py record \
            --app "$APP" --zip "$ZIP" --output app-status.json
      - name: sombra --version (through the shim)
        run: |
          got=$(sombra --version)
          echo "$got"
          test "$got" = "sombra $EXPECTED_VERSION"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
      - name: sombra doctor --json (Sombra holds the TCC grants)
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -u
          # Exit 1 is expected: --no-models leaves the models missing (a FAIL).
          sombra doctor --json > doctor.json && code=0 || code=$?
          cat doctor.json
          test "$code" -le 1
          python3 - <<'EOF'
          import json, os
          data = json.load(open("doctor.json"))
          names = {c["name"]: c for c in data["checks"]}
          assert names["sombra"]["status"] == "ok", names["sombra"]
          assert names["python"]["detail"].startswith("Python 3.12"), names["python"]
          holder = names["permissions holder"]
          # The shim disclaimed responsibility: macOS attributes this process to Sombra.app.
          assert holder["status"] == "ok", holder
          assert holder["detail"].startswith("Sombra (io.github.nickmaglowsch.Sombra) at "), holder
          signature = names["app signature"]
          print(signature)
          if os.environ["VARIANT"] == "selfsigned-test":
              assert signature["status"] == "ok", signature
              assert "'Sombra CI Throwaway'" in signature["detail"], signature
          # Expected fails on a clean runner: the models (--no-models) and the agent (no
          # provider set up), as in install-smoke.yml.
          fails = [c for c in data["checks"] if c["status"] == "fail"]
          expected = lambda c: c["name"].startswith("model ") or c["section"] == "agent"
          unexpected = [c for c in fails if not expected(c)]
          assert not unexpected, unexpected
          crashed = [c for c in data["checks"] if c["detail"].startswith("could not check")]
          assert not crashed, crashed
          EOF
      - name: Without the shim, the terminal side stays responsible (control)
        run: |
          "$APP/Contents/MacOS/Sombra" doctor --json > direct.json || true
          python3 -c '
          import json
          c = {c["name"]: c for c in json.load(open("direct.json"))["checks"]}["permissions holder"]
          print(c)
          assert not c["detail"].startswith("Sombra ("), c'
      - name: Cache models (whisper tiny + Silero VAD)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sombra/models
          key: release-smoke-models-${{ runner.os }}-${{ runner.arch }}-tiny-vad
      - name: sombra models download tiny
        run: sombra models download tiny
      - name: sombra replay (fake brain, e2e fixture)
        run: |
          fx=repo/tests/fixtures/e2e
          out=$(sombra replay "$fx/me.wav" "$fx/others.wav" --frames "$fx/frames" \
            --user Maria --fake-brain --auto-approve --stt-model tiny \
            --name release-smoke --root "$RUNNER_TEMP/meetings")
          echo "$out"
          dir=$(echo "$out" | head -n 1)
          test -s "$dir/transcript.md"
          python3 -c "
          import json, pathlib, sys
          log = pathlib.Path(sys.argv[1], 'log.jsonl').read_text().splitlines()
          types = [json.loads(line)['type'] for line in log]
          print(types)
          assert types == ['trigger', 'suggestion', 'action'], types" "$dir"
      - name: The release gate on this build
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 -c 'import json; print(json.dumps(json.load(open("app-status.json")), indent=2))'
          gate="uv run --no-project --python 3.12 repo/scripts/release/app_gate.py"
          if [ "$VARIANT" = selfsigned-test ]; then
            # Pinned to the throwaway certificate, the gate accepts it ...
            $gate ready --status app-status.json --pinned-sha256 "$(cat macos-app/pinned.sha256)"
            # ... and pinned to any other certificate, it refuses it.
            if $gate ready --status app-status.json --pinned-sha256 "$(printf '%064d' 1)"; then
              echo "::error::the gate accepted a certificate that is not the pinned one"; exit 1
            fi
          elif $gate ready --status app-status.json; then
            echo "Signed by the pinned certificate: a final tag may publish it."
          else
            echo "::notice::Not release-ready (expected without the signing secrets): a final tag would refuse to publish; a pre-release would publish it labelled ad-hoc."
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'release'
        with:
          name: macos-app-status
          path: app-status.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, smoke, app, app-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes need the previous tag
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: macos-app
      - uses: actions/download-artifact@v4
        with:
          name: macos-app-status
          path: macos-app-status
      # ADR 0050: a final tag publishes only a Sombra.app signed by the pinned self-signed
      # certificate (packaging/macos/signing-cert.sha256); a pre-release may publish an
      # ad-hoc one, labelled in the notes. Refusing fails this job: nothing is published.
      - name: macOS release gate
        id: gate
        run: |
          zip=$(ls macos-app/Sombra-*-macos-arm64.zip)
          uv run --no-project --python 3.12 scripts/release/app_gate.py decide \
            --status macos-app-status/app-status.json --tag "$GITHUB_REF_NAME" --zip "$zip" \
            --github-output "$GITHUB_OUTPUT"
      - name: Add Sombra.app to the assets and rewrite SHA256SUMS
        if: steps.gate.outputs.attach == 'true'
        run: |
          cp macos-app/Sombra-*-macos-arm64.zip dist/
          uv run --no-project --python 3.12 scripts/release/checksums.py write dist
      - name: Verify SHA256SUMS
        run: |
          uv run --no-project --python 3.12 scripts/release/checksums.py verify dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Release notes from merged PR titles
        env:
          APP_SIGNATURE: ${{ steps.gate.outputs.app_signature }}
        run: |
          uv run --no-project --python 3.12 scripts/release/notes.py "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/notes.md"
          if [ "$APP_SIGNATURE" = adhoc ]; then
            {
              echo ""
              echo "> **macOS:** \`Sombra-*-macos-arm64.zip\` in this pre-release is **ad-hoc signed**,"
              echo "> not signed with Sombra's certificate. It runs, but macOS asks for the"
              echo "> permissions again after every upgrade (ADR 0050)."
            } >> "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          # "Latest" (what releases/latest and install.sh resolve) is set explicitly: only
          # the highest final version gets it, never a patch to an older line.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Sombra $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease="$PRERELEASE" --latest="$LATEST"
