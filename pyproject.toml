[project]
name = "sombra"
version = "0.0.1"
description = "Autonomous meeting participant: local STT + screen timeline, answers for you when called."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=1.9.0",
    "keyring>=25.7.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "pyobjc-framework-coreaudio>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-screencapturekit>=10.3 ; sys_platform == 'darwin'",
    "pywhispercpp>=1.5.1",
    "rapidfuzz>=3.14.6",
    "sounddevice>=0.5 ; sys_platform == 'darwin'",
]

[project.scripts]
sombra = "sombra.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sombra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async pitfalls
    "S",             # bandit (security)
    "T20",           # no print() in library code
    "PTH",           # pathlib over os.path
]
ignore = ["RUF001", "RUF002", "RUF003"]  # PT-BR text contains ambiguous-looking unicode on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/sombra/cli.py" = ["T20"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sombra"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Native/platform bindings rarely ship type stubs.
module = ["pyobjc.*", "objc.*", "Quartz.*", "ScreenCaptureKit.*", "AVFoundation.*", "sounddevice.*", "whisper_cpp.*", "pywhispercpp.*", "onnxruntime.*", "silero_vad.*", "keyring.*", "gi.*", "dbus.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared fakes: `from fakes import FakeBrain`
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not hardware and not network'"
markers = [
    "hardware: needs real devices, models or OS permissions (never runs in CI)",
    "network: calls a real external API (never runs in CI)",
    "macos: only meaningful on macOS",
    "linux: only meaningful on Linux",
    "slow: takes more than ~2 s",
]

[tool.coverage.run]
source = ["sombra"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]
